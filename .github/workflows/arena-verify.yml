name: Verify arena branch

# Compiles the fork and runs the Leaf unit tests on every push to the arena working
# branch. The upstream build workflow only listens on ver/1.21.4, so without this
# nothing would catch a broken patch or a broken Java class in our branch.

on:
  push:
    branches: [ "arena/6804670c-leaf" ]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          git config --global core.preloadindex true
          git config --global core.fscache true

      - name: Configure gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Apply patches
        run: |
          set -o pipefail
          ./gradlew applyAllPatches --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-patch.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Locate the generated sources
        if: always()
        run: |
          set +e
          echo "== trees =="
          find .gradle/caches/paperweight/upstreams -maxdepth 3 -name file -type d 2>/dev/null
          # The patches land in the tree of the registered upstream ("gale"); find it by our own
          # marker instead of guessing, so that the excerpts below always show post-patch code.
          PATCHED="$(grep -rl --include=LevelChunk.java 'leafPayloadRevision' .gradle/caches/paperweight/upstreams 2>/dev/null | head -1)"
          if [ -n "$PATCHED" ]; then
            ROOT="${PATCHED%/net/minecraft/world/level/chunk/LevelChunk.java}"
          else
            ROOT="$(find .gradle/caches/paperweight/upstreams -path '*/gale/file/src/minecraft/java' -type d 2>/dev/null | head -1)"
          fi
          echo "PATCHED=$PATCHED"
          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" > /tmp/root.env
          echo "PATCHED=$PATCHED" >> /tmp/root.env

      - name: Verify the leaf hooks are in the generated tree
        if: always()
        run: |
          set +e
          . /tmp/root.env
          REPORT=/tmp/hooks.txt
          : > "$REPORT"
          for marker in leafPayloadRevision 'off-heap chunk payload cache' 'LeafChunkPayloads'; do
            echo "### marker: $marker"
            grep -rn --include=*.java "$marker" .gradle/caches/paperweight/upstreams 2>/dev/null | head -5
            echo
          done >> "$REPORT"
          echo "### hook report"
          cat "$REPORT"
          python3 - "$REPORT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:4], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=HOOKS-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Excerpt - chunk packet pipeline
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh range CKPT "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkPacketData.java" 40 130
          scripts/ci/publish-excerpts.sh range CKWL "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkWithLightPacket.java" 30 100
          scripts/ci/publish-excerpts.sh range PCS  "$ROOT/net/minecraft/server/network/PlayerChunkSender.java" 60 135

      - name: Excerpt - LevelChunk
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method LC-SETBLOCK "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 'BlockState setBlockState(BlockPos' 90
          scripts/ci/publish-excerpts.sh method LC-GETBLOCK "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 'BlockState getBlockState(BlockPos' 45

      - name: Excerpt - tick paths
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method SCC-TICKCHUNKS "$ROOT/net/minecraft/server/level/ServerChunkCache.java" 'void tickChunks()' 130
          scripts/ci/publish-excerpts.sh method ENTITY-INSIDE "$ROOT/net/minecraft/world/entity/Entity.java" 'checkInsideBlocks()' 70

      - name: Excerpt - BlockPos walk
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method BP-WITHIN "$ROOT/net/minecraft/core/BlockPos.java" 'Iterable<BlockPos> withinManhattan' 70

      - name: Run Leaf unit tests
        run: |
          set -o pipefail
          ./gradlew :leaf-server:test --tests 'org.dreeam.leaf.*' --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-test.log

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            leaf-server/build/reports/tests/**
            leaf-server/build/test-results/**
          if-no-files-found: ignore

      - name: Build the server jar
        run: |
          set -o pipefail
          ./gradlew :leaf-server:jar --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-jar.log

      - name: Publish failure details as annotations
        if: failure()
        run: |
          set +e
          for f in /tmp/gradle-patch.log /tmp/gradle-test.log /tmp/gradle-jar.log; do
            [ -f "$f" ] || continue
            OUT="/tmp/failure-$(basename "$f").txt"
            {
              echo "### $f : error context"
              grep -nE "error:|FAILED|Compilation failed|Execution failed|what went wrong" "$f" | head -40 | cut -d: -f1 | while read -r line; do
                start=$(( line > 3 ? line - 3 : 1 ))
                end=$(( line + 6 ))
                sed -n "${start},${end}p" "$f"
                echo "---"
              done
              echo "### $f : tail"
              tail -n 40 "$f"
            } > "$OUT"
            echo "failure excerpt $(basename "$OUT"): $(wc -c < "$OUT") bytes"
            NAME="$(basename "$f" .log | tr 'a-z-' 'A-Z-')"
            NAME="$NAME" python3 - "$OUT" <<'PYEOF'
          import os
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          name = os.environ.get("NAME", "CI-FAILURE")
          for index, chunk in enumerate(chunks[:6], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name}-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF
          done
