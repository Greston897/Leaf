name: Verify arena branch

# Compiles the fork and runs the Leaf unit tests on every push to the arena working
# branch. The upstream build workflow only listens on ver/1.21.4, so without this
# nothing would catch a broken patch or a broken Java class in our branch.

on:
  push:
    branches: [ "arena/6804670c-leaf" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          git config --global core.preloadindex true
          git config --global core.fscache true

      - name: Configure gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Apply patches
        run: |
          set -o pipefail
          ./gradlew applyAllPatches --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-patch.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Locate the generated sources
        if: always()
        run: |
          set +e
          echo "== candidate source roots =="
          for candidate in leaf-server/src/minecraft/java .gradle/caches/paperweight/upstreams/server-work/gale/file/src/minecraft/java; do
            [ -d "$candidate/net/minecraft" ] && echo "present: $candidate"
          done
          # Prefer the tree the leaf patches are applied to (the generated project), and fall back
          # to whatever copy actually carries our own patch marker.
          ROOT=""
          for candidate in leaf-server/src/minecraft/java .gradle/caches/paperweight/upstreams/server-work/gale/file/src/minecraft/java; do
            if [ -d "$candidate/net/minecraft" ]; then ROOT="$candidate"; break; fi
          done
          PATCHED="$(grep -rl --include=LevelChunk.java 'leafPayloadRevision' . 2>/dev/null | grep -v '^./.git' | head -1)"
          if [ -n "$PATCHED" ]; then
            ROOT="${PATCHED%/net/minecraft/world/level/chunk/LevelChunk.java}"
          fi
          echo "PATCHED=$PATCHED"
          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" > /tmp/root.env
          echo "PATCHED=$PATCHED" >> /tmp/root.env

      - name: Verify the leaf hooks are in the generated tree
        if: always()
        run: |
          set +e
          . /tmp/root.env
          REPORT=/tmp/hooks.txt
          : > "$REPORT"
          for marker in leafPayloadRevision 'LeafChunkPayloads' \
                        'collect the chunks to send without streams' \
                        'no intermediate BlockPos per call' \
                        'hoist the loop invariants' \
                        'tick by index instead of allocating an iterator' \
                        'one array read per lookup' \
                        'one class loader per identical library set' \
                        'lazy maven stack'; do
            echo "### marker: $marker"
            grep -rn --include=*.java "$marker" leaf-server paper-api leaf-api .gradle/caches/paperweight/upstreams 2>/dev/null | grep -v '^leaf-server/src/main' | head -5
            echo
          done >> "$REPORT"
          echo "### hook report"
          cat "$REPORT"
          python3 - "$REPORT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:4], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=HOOKS-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Excerpt - chunk packet pipeline
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh range CKPT "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkPacketData.java" 40 130
          scripts/ci/publish-excerpts.sh range CKWL "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkWithLightPacket.java" 30 100
          scripts/ci/publish-excerpts.sh method PCS "$ROOT/net/minecraft/server/network/PlayerChunkSender.java" 'collectChunksToSend(ChunkMap' 60
          scripts/ci/publish-excerpts.sh method CHUNKPOS-GETX "$ROOT/net/minecraft/world/level/ChunkPos.java" 'public static int getX(long' 25

      - name: Excerpt - entity and chunk tick paths
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method ENTITY-INSIDE "$ROOT/net/minecraft/world/entity/Entity.java" 'InsideBlock' 110
          scripts/ci/publish-excerpts.sh method SCC-TICKCHUNKS "$ROOT/net/minecraft/server/level/ServerChunkCache.java" 'private void tickChunks(long' 200
          scripts/ci/publish-excerpts.sh method SCC-COLLECT "$ROOT/net/minecraft/server/level/ServerChunkCache.java" 'collectTickingChunks(List' 45

      - name: Excerpt - LevelChunk block access
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method LC-GETBLOCK "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 'BlockState getBlockStateFinal' 45
          scripts/ci/publish-excerpts.sh method LC-SECTIONINDEX "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 'int getSectionIndex(int' 20
          scripts/ci/publish-excerpts.sh method LCS-GETBLOCK "$ROOT/net/minecraft/world/level/chunk/LevelChunkSection.java" 'BlockState getBlockState(int' 35

      - name: Excerpt - BlockPos walks
        if: always()
        run: |
          set +e
          . /tmp/root.env
          scripts/ci/publish-excerpts.sh method BP-WITHIN "$ROOT/net/minecraft/core/BlockPos.java" 'Iterable<BlockPos> withinManhattan' 55
          scripts/ci/publish-excerpts.sh method BP-BETWEEN "$ROOT/net/minecraft/core/BlockPos.java" 'Iterable<BlockPos> betweenClosed(AABB' 30

      - name: Find the plugin and library loader sources
        if: always()
        run: |
          set +e
          OUT=/tmp/loaders.txt
          {
            echo "### files matching *LibraryLoader*"
            find . -name '*LibraryLoader*.java' -not -path './.git/*' 2>/dev/null | head -20
            echo "### plugin loading tree (io/papermc/paper/plugin)"
            find . -path '*io/papermc/paper/plugin*' -name '*.java' -not -path './.git/*' 2>/dev/null | head -60
            echo "### maven resolver / library util classes"
            find . \( -name '*MavenLibraryResolver*.java' -o -name '*PluginJar*.java' \) -not -path './.git/*' 2>/dev/null | head -20
          } > "$OUT"
          cat "$OUT"
          python3 - "$OUT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:6], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=LOADERS-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Excerpt - library loaders
        if: always()
        run: |
          set +e
          for file in $(find . -name '*LibraryLoader*.java' -not -path './.git/*' 2>/dev/null | head -3); do
            name="$(basename "$file" .java | tr 'a-z' 'A-Z')"
            echo "== $file"
            scripts/ci/publish-excerpts.sh range "LOADER-$name" "$file" 1 400
          done

      - name: Excerpt - spigot plugin provider and class loader
        if: always()
        run: |
          set +e
          for pattern in SpigotPluginProvider SpigotPluginParent PluginClassLoader PaperPluginParent; do
            file="$(find . -name "$pattern.java" -not -path './.git/*' 2>/dev/null | head -1)"
            [ -n "$file" ] || continue
            scripts/ci/publish-excerpts.sh range "LOADER-$pattern" "$file" 1 400
          done

      - name: Verify the RAM fixes are in the tree
        if: always()
        run: |
          set +e
          OUT=/tmp/ram.txt
          {
            echo "### payload cache (Caffeine)"
            grep -n "Caffeine\|expireAfterAccess\|maximumWeight" leaf-server/src/main/java/org/dreeam/leaf/perf/offheap/OffHeapChunkPayloadCache.java
            echo "### node evaluator pool caps"
            grep -n "maxCachedEvaluators\|maxCachedFeatureSets" leaf-server/src/main/java/org/dreeam/leaf/async/path/NodeEvaluatorCache.java
            echo "### rail pool (long keys)"
            grep -n "Long2BooleanOpenHashMap\|maxTrackedPositions\|CHECKED_POS_POOL.clear" leaf-server/src/main/java/org/dreeam/leaf/world/block/OptimizedPoweredRails.java
            echo "### no leftover object-keyed rail map"
            grep -rn "Object2BooleanOpenHashMap<BlockPos>" leaf-server/src/main/java || echo "none (good)"
          } > "$OUT"
          cat "$OUT"
          python3 - "$OUT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:4], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=RAMFIX-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Report the test task configuration
        if: always()
        run: |
          set +e
          REPORT=/tmp/testcfg.txt
          : > "$REPORT"
          {
            echo "### test task config in the generated build script"
            for f in leaf-server/build.gradle.kts build.gradle.kts; do
              [ -f "$f" ] || continue
              echo "--- $f"
              grep -n -A12 -E "tasks\.(named|withType).*Test|useJUnitPlatform|includeTestsMatching|filter \{" "$f" | head -60
            done
          } >> "$REPORT"
          cat "$REPORT"
          python3 - "$REPORT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:3], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=TESTCFG-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Register a dedicated test task
        run: |
          cat > /tmp/leaf-tests.init.gradle <<'EOF'
          // ':leaf-server:test' carries an upstream include filter (**/*TestSuite.class) that silently
          // skips ordinary *Test classes, and it is installed after an init script's own configuration
          // runs, so overriding it in place is fragile. Register a separate test task instead: it uses
          // the very same compiled test classes and runtime classpath, but no inherited filter.
          gradle.projectsEvaluated {
              def project = rootProject.findProject(':leaf-server')
              if (project == null) {
                  throw new GradleException('leaf-server project not found')
              }
              project.tasks.register('leafUnitTest', org.gradle.api.tasks.testing.Test) { task ->
                  task.description = 'Runs the Leaf unit tests (org.dreeam.leaf.*) without the upstream filter'
                  task.group = 'verification'
                  task.testClassesDirs = project.sourceSets.test.output.classesDirs
                  task.classpath = project.sourceSets.test.runtimeClasspath
                  task.useJUnitPlatform()
                  task.filter {
                      includeTestsMatching('org.dreeam.leaf.*')
                      setFailOnNoMatchingTests(true)
                  }
                  task.testLogging {
                      events 'passed', 'failed', 'skipped'
                      exceptionFormat 'full'
                  }
              }

              // Dumps the test runtime classpath, so the alternative VM run can be started with a
              // plain 'java' instead of Gradle (Gradle 8 does not support JDK 25 as its launcher).
              project.tasks.register('leafTestClasspath') { task ->
                  task.description = 'Writes the leaf-server test runtime classpath to build/leaf-test-classpath.txt'
                  task.group = 'verification'
                  task.doLast {
                      def out = project.layout.buildDirectory.file('leaf-test-classpath.txt').get().asFile
                      out.parentFile.mkdirs()
                      def entries = new ArrayList(project.sourceSets.test.runtimeClasspath.files)
                      // Gradle injects junit-platform-launcher into its own test worker, so it is not
                      // part of the runtime classpath - but the plain-java launcher needs it. Reuse
                      // the platform version that is already on the classpath.
                      def commons = entries.find { it.name.startsWith('junit-platform-commons-') }
                      if (commons != null) {
                          def version = commons.name.substring('junit-platform-commons-'.length())
                          version = version.substring(0, version.length() - '.jar'.length())
                          try {
                              def launcher = project.configurations.detachedConfiguration(
                                  project.dependencies.create("org.junit.platform:junit-platform-launcher:${version}"))
                              launcher.transitive = true
                              entries.addAll(launcher.files)
                              out.text = entries.join(File.pathSeparator)
                              println "[Leaf CI] test classpath written to ${out} (${entries.size()} entries, launcher ${version})"
                          } catch (Exception exception) {
                              out.text = entries.join(File.pathSeparator)
                              println "[Leaf CI] launcher ${version} could not be resolved: ${exception.message}"
                          }
                      } else {
                          out.text = entries.join(File.pathSeparator)
                          println "[Leaf CI] no junit-platform-commons on the classpath"
                      }
                  }
              }
          }
          EOF

      - name: Run Leaf unit tests
        run: |
          set -o pipefail
          ./gradlew :leaf-server:leafUnitTest --init-script /tmp/leaf-tests.init.gradle --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-test.log

      - name: Explain a failed test build
        if: always()
        run: |
          set +e
          LOG=/tmp/gradle-test.log
          if ! grep -qE "BUILD FAILED|error:" "$LOG" 2>/dev/null; then
            echo "no build failure in the gradle log"
            exit 0
          fi
          OUT=/tmp/builderr.txt
          {
            echo "### gradle failure extract"
            grep -nE "\.java:[0-9]+: (error|warning):|^e: |^> Task .*FAILED|^FAILURE: |^\* What went wrong|^Execution failed for task" "$LOG" | head -60
            echo "--- first lines of the failing task ---"
            grep -nE "^> Task .*FAILED" "$LOG" | head -3
            grep -A 25 "What went wrong" "$LOG" | head -40
          } > "$OUT" 2>&1
          cat "$OUT"
          python3 - "$OUT" <<'PYEOF'
          import sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          chunks, current = [], ""
          for line in lines:
              escaped = line.replace("%", "%25").replace("\r", "")
              candidate = (current + "%0A" + escaped) if current else escaped
              if len(candidate) > 3000:
                  chunks.append(current)
                  current = escaped
              else:
                  current = candidate
          if current or not chunks:
              chunks.append(current)
          total = len(chunks)
          for index, chunk in enumerate(chunks[:4], start=1):
              print(f"::error title=BUILDERR-{index}-OF-{total}::build failure {index}/{total}%0A{chunk}")
          PYEOF

      - name: Dump the test runtime classpath for the alternative VM run
        if: always()
        run: |
          set +e
          ./gradlew :leaf-server:leafTestClasspath --init-script /tmp/leaf-tests.init.gradle --no-daemon 2>&1 | tail -5
          ls -la leaf-server/build/leaf-test-classpath.txt

      - name: Prove the fork's assumptions on GraalVM 25 with compact object headers
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT=/tmp/altvm.txt
          : > "$OUT"

          # Everything happens inside a function: 'exit' in a shell group would leave the script before
          # the report below is published, which is exactly how the previous attempt lost its output.
          probe() {
            CP_FILE=leaf-server/build/leaf-test-classpath.txt
            if [ ! -f "$CP_FILE" ]; then
              echo "[altvm] skipped: no test classpath dump ($CP_FILE)"
              return 0
            fi

            # setup-java's 'graalvm' distribution does not publish a JDK 25 build for every runner
            # image (it silently produced a Temurin 25 in an earlier attempt), so fetch the real
            # GraalVM Community archive from its release feed.
            JAVA25=/tmp/graalvm25/bin/java
            if [ ! -x "$JAVA25" ]; then
              # the runner image ships a GraalVM toolcache on some labels - prefer it, it is free
              CACHED=$(ls -d /opt/hostedtoolcache/Java_GraalVM/*/x64/bin/java 2>/dev/null | tail -1)
              if [ -n "$CACHED" ] && [ -x "$CACHED" ]; then
                JAVA25="$CACHED"
                echo "[altvm] using the toolcache JDK $JAVA25"
              fi
            fi
            if [ ! -x "$JAVA25" ]; then
              URL=$(curl -s --max-time 60 "https://api.github.com/repos/graalvm/graalvm-ce-builds/releases?per_page=60" \
                | python3 -c '
          import json, sys
          try:
              releases = json.load(sys.stdin)
          except Exception as error:
              print("feed error: %s" % error, file=sys.stderr)
              sys.exit(0)
          for release in releases:
              if not release.get("tag_name", "").startswith("jdk-25"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  if name.startswith("graalvm-community-jdk-25") and name.endswith("_linux-x64_bin.tar.gz"):
                      print(asset["browser_download_url"])
                      sys.exit(0)
          ')
              if [ -z "$URL" ]; then
                echo "[altvm] skipped: no GraalVM Community JDK 25 linux-x64 archive in the release feed"
                return 0
              fi
              echo "[altvm] downloading $URL"
              mkdir -p /tmp/graalvm25
              if ! curl -fsSL --retry 2 --max-time 900 "$URL" -o /tmp/graalvm25.tar.gz; then
                echo "[altvm] skipped: download failed ($URL)"
                return 0
              fi
              echo "[altvm] archive: $(du -h /tmp/graalvm25.tar.gz | cut -f1)"
              if ! tar -xzf /tmp/graalvm25.tar.gz -C /tmp/graalvm25 --strip-components=1; then
                echo "[altvm] skipped: extraction failed"
                return 0
              fi
            fi
            "$JAVA25" -version 2>&1 | head -3
            if ! "$JAVA25" -version 2>&1 | grep -qi graalvm; then
              echo "[altvm] skipped: the downloaded JDK does not report itself as GraalVM"
              return 0
            fi

            CP="$(cat "$CP_FILE"):leaf-server/build/classes/java/test:leaf-server/build/resources/test"
            mkdir -p /tmp/altrun
            cat > /tmp/altrun/AltVmRunner.java <<'JAVA'
          import org.junit.platform.launcher.Launcher;
          import org.junit.platform.launcher.LauncherDiscoveryRequest;
          import org.junit.platform.launcher.core.LauncherDiscoveryRequestBuilder;
          import org.junit.platform.launcher.core.LauncherFactory;
          import org.junit.platform.launcher.listeners.SummaryGeneratingListener;

          import static org.junit.platform.engine.discovery.DiscoverySelectors.selectPackage;

          public final class AltVmRunner {
              public static void main(final String[] args) {
                  final LauncherDiscoveryRequest request = LauncherDiscoveryRequestBuilder.request()
                      .selectors(selectPackage("org.dreeam.leaf"))
                      .build();
                  final Launcher launcher = LauncherFactory.create();
                  final SummaryGeneratingListener listener = new SummaryGeneratingListener();
                  launcher.execute(request, listener);
                  final var summary = listener.getSummary();
                  System.out.println("[altvm] vm " + System.getProperty("java.vm.name") + " "
                      + System.getProperty("java.vm.version") + " / JDK "
                      + System.getProperty("java.specification.version"));
                  System.out.println("[altvm] jvm args: "
                      + String.join(" ", java.lang.management.ManagementFactory
                          .getRuntimeMXBean().getInputArguments()));
                  System.out.println("[altvm] tests started " + summary.getTestsStartedCount()
                      + ", succeeded " + summary.getTestsSucceededCount()
                      + ", failed " + summary.getTestsFailedCount());
                  summary.getFailures().forEach(failure -> System.out.println("[altvm] FAIL "
                      + failure.getTestIdentifier().getDisplayName() + ": " + failure.getException()));
                  System.exit(summary.getTestsFailedCount() == 0L && summary.getTestsStartedCount() > 0L ? 0 : 1);
              }
          }
          JAVA
            # a 21 class file runs unchanged on 25, and the build JDK is the one on PATH here
            if ! javac -nowarn -cp "$(cat "$CP_FILE")" -d /tmp/altrun /tmp/altrun/AltVmRunner.java 2>/tmp/altrun/javac.log; then
              echo "[altvm] skipped: the runner did not compile"
              tail -20 /tmp/altrun/javac.log
              return 0
            fi
            "$JAVA25" -XX:+UnlockExperimentalVMOptions -XX:+UseCompactObjectHeaders \
              -cp "/tmp/altrun:$CP" AltVmRunner 2>&1 | grep -v 'unknown enum constant' | tail -60
            echo "[altvm] exit code: ${PIPESTATUS[0]}"
            return 0
          }

          { echo "### GraalVM 25 proof (non blocking)"; probe; } >> "$OUT" 2>&1
          cat "$OUT"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat "$OUT" >> "$GITHUB_STEP_SUMMARY"; fi
          python3 - "$OUT" <<'PYEOF'
          import sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          chunks, current = [], ""
          for line in lines:
              escaped = line.replace("%", "%25").replace("\r", "")
              candidate = (current + "%0A" + escaped) if current else escaped
              # GitHub counts the escaped text against the 4096 byte annotation limit.
              if len(candidate) > 3200:
                  chunks.append(current)
                  current = escaped
              else:
                  current = candidate
          if current or not chunks:
              chunks.append(current)
          total = len(chunks)
          for index, chunk in enumerate(chunks[:6], start=1):
              print(f"::error title=ALT-VM-{index}-OF-{total}::alternative VM proof {index}/{total}%0A{chunk}")
          PYEOF

      - name: Publish the test results as annotations
        if: always()
        run: |
          set +e
          OUT=/tmp/testreport.txt
          : > "$OUT"
          python3 - >> "$OUT" <<'PYEOF'
          import glob
          import xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          rows = []
          for path in sorted(glob.glob("leaf-server/build/test-results/*/*.xml")):
              root = ET.parse(path).getroot()
              tests = int(root.get("tests", 0))
              failed = int(root.get("failures", 0))
              broken = int(root.get("errors", 0))
              skipped_here = int(root.get("skipped", 0))
              total += tests
              failures += failed
              errors += broken
              skipped += skipped_here
              rows.append(f"{root.get('name')}: {tests} tests, {failed} failed, {broken} errors, {skipped_here} skipped")

          print("### leaf unit tests")
          for row in rows:
              print(row)
          print(f"### total: {total} tests, {failures} failed, {errors} errors, {skipped} skipped")
          if total == 0:
              print("### ERROR: no test results were produced - the org.dreeam.leaf tests did not run")
          PYEOF
          cat "$OUT"
          python3 - "$OUT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:4], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=TESTRESULTS-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF
          grep -q "### ERROR: no test results" "$OUT" && { echo "no unit test ran"; exit 1; }
          exit 0

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            leaf-server/build/reports/tests/**
            leaf-server/build/test-results/**
          if-no-files-found: ignore

      - name: Build the runnable jar
        run: |
          set -o pipefail
          ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-jar.log

      - name: Collect the jar
        run: |
          set -euo pipefail
          NAME="leaf-1.21.4-arena-${GITHUB_RUN_NUMBER}.jar"
          JAR="$(find . -name '*paperclip*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          if [ -z "$JAR" ]; then
            JAR="$(find . -path '*/build/libs/*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          fi
          if [ -z "$JAR" ]; then
            echo "no jar was produced"
            exit 1
          fi
          echo "using $JAR"
          cp "$JAR" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          ls -la "$NAME" "$NAME.sha256"
          cat "$NAME.sha256"

      - name: Upload the jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-1.21.4-arena-${{ github.run_number }}
          path: |
            leaf-1.21.4-arena-*.jar
            leaf-1.21.4-arena-*.jar.sha256
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="leaf-1.21.4-arena-${GITHUB_RUN_NUMBER}.jar"
          TAG="arena-1.21.4"
          {
            echo "Build of \`${GITHUB_SHA:0:7}\` on \`arena/6804670c-leaf\` (run #${GITHUB_RUN_NUMBER})."
            echo
            echo "Leaf 1.21.4, arena branch. This run verified \`applyAllPatches\`, the Leaf unit tests and the jar build."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Java | 21+ |"
            echo "| Jar | \`$NAME\` |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$NAME.sha256")\` |"
            echo
            echo "The off-heap chunk payload cache is off by default; enable it with \`-Dleaf.offHeap.chunkCacheMB=<MiB>\`."
          } > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
            gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" \
              --title "Leaf 1.21.4 - arena build" \
              --notes-file /tmp/release-notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "release url: $(gh release view "$TAG" --json url -q .url)"

      - name: Diagnose the test run
        if: always()
        run: |
          set +e
          OUT=/tmp/tesdiag.txt
          {
            echo "### compiled test classes"
            find leaf-server/build/classes/java/test -name '*.class' 2>/dev/null | head -20
            echo "### test results dir"
            ls -la leaf-server/build/test-results/* 2>/dev/null | head -20
            echo "### interesting log lines"
            grep -nE "Leaf CI|No tests found|> Task :leaf-server:(test|leafUnitTest)|SKIPPED|BUILD " /tmp/gradle-test.log 2>/dev/null | head -30
          } > "$OUT"
          cat "$OUT"
          python3 - "$OUT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          for index, chunk in enumerate(chunks[:4], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=TESTDIAG-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Publish failure details as annotations
        if: failure()
        run: |
          set +e
          for f in /tmp/gradle-patch.log /tmp/gradle-test.log /tmp/gradle-jar.log; do
            [ -f "$f" ] || continue
            OUT="/tmp/failure-$(basename "$f").txt"
            {
              echo "### $f : error context"
              grep -nE "error:|FAILED|Compilation failed|Execution failed|what went wrong" "$f" | head -40 | cut -d: -f1 | while read -r line; do
                start=$(( line > 3 ? line - 3 : 1 ))
                end=$(( line + 6 ))
                sed -n "${start},${end}p" "$f"
                echo "---"
              done
              echo "### $f : tail"
              tail -n 40 "$f"
            } > "$OUT"
            echo "failure excerpt $(basename "$OUT"): $(wc -c < "$OUT") bytes"
            NAME="$(basename "$f" .log | tr 'a-z-' 'A-Z-')"
            NAME="$NAME" python3 - "$OUT" <<'PYEOF'
          import os
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 3500
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)] or [""]
          name = os.environ.get("NAME", "CI-FAILURE")
          for index, chunk in enumerate(chunks[:6], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name}-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF
          done

      # ---------------------------------------------------------------------------------------
      # GraalVM 25 compatibility proof. Runs last on purpose: installing a second JDK changes
      # JAVA_HOME, and nothing after this point shells out to Gradle.
      # ---------------------------------------------------------------------------------------
