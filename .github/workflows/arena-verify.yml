name: Verify arena branch

# Compiles the fork and runs the Leaf unit tests on every push to the arena working
# branch. The upstream build workflow only listens on ver/1.21.4, so without this
# nothing would catch a broken patch or a broken Java class in our branch.

on:
  push:
    branches: [ "arena/6804670c-leaf" ]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          git config --global core.preloadindex true
          git config --global core.fscache true

      - name: Configure gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Apply patches
        run: |
          ./gradlew applyAllPatches --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Publish upstream excerpts as annotations
        if: always()
        run: |
          set +e
          ROOT=""
          for candidate in paper-server/src/minecraft/java paper-server/src/main/java; do
            if [ -f "$candidate/net/minecraft/core/BlockPos.java" ]; then ROOT="$candidate"; fi
          done
          echo "chosen root: $ROOT"
          OUT=/tmp/excerpts.txt
          : > "$OUT"

          {
            echo "### ROOT: $ROOT"
            echo
            echo "### ClientboundLevelChunkPacketData.java"
            sed -n '1,140p' "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkPacketData.java" 2>/dev/null
            echo
            echo "### ClientboundLevelChunkWithLightPacket.java"
            sed -n '1,110p' "$ROOT/net/minecraft/network/protocol/game/ClientboundLevelChunkWithLightPacket.java" 2>/dev/null
            echo
            echo "### PlayerChunkSender.java"
            sed -n '55,145p' "$ROOT/net/minecraft/server/network/PlayerChunkSender.java" 2>/dev/null
            echo
            echo "### LevelChunk setBlockState"
            awk '/BlockState setBlockState\(BlockPos/,/^    }/' "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 2>/dev/null | head -90
            echo
            echo "### LevelChunk getBlockState"
            awk '/BlockState getBlockState\(BlockPos/,/^    }/' "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 2>/dev/null | head -40
            echo
            echo "### LevelChunk class declaration and first fields"
            head -n 120 "$ROOT/net/minecraft/world/level/chunk/LevelChunk.java" 2>/dev/null
            echo
            echo "### ServerChunkCache tickChunks"
            awk '/void tickChunks\(\)/,/^    }/' "$ROOT/net/minecraft/server/level/ServerChunkCache.java" 2>/dev/null | head -140
            echo
            echo "### Entity checkInsideBlocks"
            awk '/checkInsideBlocks\(\)/,/^    }/' "$ROOT/net/minecraft/world/entity/Entity.java" 2>/dev/null | head -70
            echo
            echo "### BlockPos withinManhattan"
            awk '/Iterable<BlockPos> withinManhattan/,/^    }/' "$ROOT/net/minecraft/core/BlockPos.java" 2>/dev/null | head -70
          } >> "$OUT" 2>&1

          echo "excerpt size: $(wc -c < "$OUT") bytes"
          python3 - "$OUT" <<'PYEOF'
          import sys
          data = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          limit = 55000
          chunks = [data[i:i + limit] for i in range(0, len(data), limit)]
          for index, chunk in enumerate(chunks[:8], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=UPSTREAM-EXCERPT-{index}-OF-{len(chunks)}::{escaped}")
          PYEOF

      - name: Run Leaf unit tests
        run: |
          ./gradlew :leaf-server:test --tests 'org.dreeam.leaf.*' --stacktrace --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            leaf-server/build/reports/tests/**
            leaf-server/build/test-results/**
          if-no-files-found: ignore

      - name: Build the server jar
        run: |
          ./gradlew :leaf-server:jar --stacktrace --no-daemon
